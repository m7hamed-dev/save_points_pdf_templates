name: save_points_pdf_templates
description: >-
  Printable business documents for Flutter — invoices, expense records,
  receipt vouchers and tabular reports — rendered to PDF with Arabic/RTL
  support, a themeable design system and page-aware tables.
version: 0.1.0
homepage: https://github.com/m7hamed-dev/save_points_pdf_templates
repository: https://github.com/m7hamed-dev/save_points_pdf_templates
issue_tracker: https://github.com/m7hamed-dev/save_points_pdf_templates/issues

screenshots:
  - description: A sales invoice in English, partially paid.
    path: doc/screenshots/invoice-en.png
  - description: The same invoice in Arabic, mirrored right to left.
    path: doc/screenshots/invoice-ar.png
  - description: A receipt voucher with dotted fill-in lines and signatures.
    path: doc/screenshots/voucher-ar.png
  - description: The classic preset — a full grid and a filled table header.
    path: doc/screenshots/theme-classic.png
  - description: The minimal preset — no fills and no rules between rows.
    path: doc/screenshots/theme-minimal.png

topics:
  - pdf
  - invoice
  - printing
  - arabic

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
