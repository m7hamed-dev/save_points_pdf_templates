name: save_points_pdf_templates
description: >-
  Printable business documents for Flutter — invoices, expense records,
  receipt vouchers and tabular reports — rendered to PDF with Arabic/RTL
  support, a themeable design system and page-aware tables.
version: 0.2.0
homepage: https://github.com/m7hamed-dev/save_points_pdf_templates
repository: https://github.com/m7hamed-dev/save_points_pdf_templates
issue_tracker: https://github.com/m7hamed-dev/save_points_pdf_templates/issues

topics:
  - pdf
  - invoice
  - printing
  - arabic

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
