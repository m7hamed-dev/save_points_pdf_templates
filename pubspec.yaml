name: save_points_pdf_templates
description: Production-ready Flutter package for printing invoices, receipts, vouchers, inventory documents, and POS reports with Arabic/RTL support.
version: 0.1.0
homepage: https://github.com/m7hamed-dev/save_points_pdf_templates

environment:
  sdk: ^3.11.5
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  barcode: ^2.2.9
  esc_pos_utils_plus: ^2.0.4
  intl: ^0.20.2
  meta: ^1.16.0
  pdf: ^3.11.3
  printing: ^5.14.2
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
